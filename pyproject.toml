[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytools"
version = "0.3.0"
description = "House-style Python plumbing (Decimal money parsing, typed errors, logging, HTTP retry, request signing, kill switch) shared across midnightodyssey projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "midnightodyssey" },
]
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
click = ["click>=8.0"]
http = ["httpx>=0.27", "anyio>=4"]
crypto = ["cryptography>=42"]
dev = [
    "ruff==0.17.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pydantic>=2.0",
    "click>=8.0",
    "httpx>=0.27",
    "cryptography>=42",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytools"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.coverage.run]
source = ["src/pytools"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["pytools"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ANN", "N", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["pytools"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
